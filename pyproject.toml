[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "football-evolution-lab"
version = "0.1.0"
description = "Reproducible football analytics, starting with Lionel Messi"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3", "numpy>=1.24,<3", "requests>=2.31,<3", "duckdb>=1.0,<2", "scikit-learn>=1.3,<2", "plotly>=5.18,<7", "streamlit>=1.50,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "matplotlib>=3.8,<4"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
